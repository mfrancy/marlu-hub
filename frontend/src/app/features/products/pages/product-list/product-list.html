<p-card header="Lista de produtos" class="p-4">
  <div class="flex justify-content-between align-items-center mb-4">
    <div>
      <p class="text-color-secondary mt-1 mb-0 text-sm">
        Consulte todos os produtos cadastrados no sistema
      </p>
    </div>
  </div>
  <p-table
    [paginator]="true"
    [rows]="5"
    [value]="product()"
    [rowHover]="true"
    class="p-datatable-striped"
    [rowsPerPageOptions]="[5, 10]"
    [globalFilterFields]="['name', 'brand', 'category', 'code']"
    #dt
  >
    <ng-template #caption>
      <div class="d-flex justify-content-end">
        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            placeholder="Buscar"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
          />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Código revista</th>
        <th>Produto</th>
        <th>Descrição</th>
        <th>Marca</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td>{{ product.code }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.brand }}</td>
        <td>
          <div class="d-flex">
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              (onClick)="showEditDialog(product)"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              (onClick)="showConfirmDialog(product)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
<app-edit-product
  [visible]="editDialogVisible"
  [product]="dataProduct"
  (visibleChange)="editDialogVisible = $event"
  (productUpdated)="onUpdated()"
></app-edit-product>
<app-confirm-dialog
  [visible]="confirmDialogVisible"
  [product]="dataProduct"
  (visibleChange)="confirmDialogVisible = $event"
  (deletedProduct)="onDeleted()"
></app-confirm-dialog>
